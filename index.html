<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="心真農園">
<meta name="theme-color" content="#1a5c35">
<title>心真農園 勤怠表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --green:#1a5c35;--green2:#2d8a55;--green3:#3da668;
  --green-light:#e8f5ee;--green-mid:#b7dfc7;
  --amber:#f59e0b;--amber-light:#fef3c7;
  --red:#e53e3e;--red-light:#fff0f0;
  --bg:#f2f7f4;--surface:#fff;
  --text:#0f2d1a;--text2:#3d6b50;--text3:#7aaa8a;
  --border:#dceee3;
  --r:18px;--r2:12px;--r3:28px;
}
html,body{height:100%;font-family:'M PLUS 1p',sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;min-height:100dvh}

.header{background:var(--green);padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.2)}
.header-top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.logo{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.header-text{flex:1}
.header-text h1{font-family:'Zen Kaku Gothic New',sans-serif;font-size:17px;font-weight:700;color:#fff;letter-spacing:.03em}
.header-text p{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
.header-right{display:flex;align-items:center;gap:8px}
.sync-area{display:flex;align-items:center;gap:5px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .5s;flex-shrink:0}
.sync-ok{background:#4ade80}.sync-err{background:#f87171}
.sync-ing{background:#fbbf24;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.sync-txt{font-size:10px;color:rgba(255,255,255,.5)}

/* 通知ボタン */
.notif-btn{
  border:1.5px solid rgba(255,255,255,.3);border-radius:20px;
  padding:5px 10px;font-size:11px;font-weight:700;
  font-family:'M PLUS 1p',sans-serif;
  background:none;color:rgba(255,255,255,.8);cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
.notif-btn.on{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.6)}
.notif-btn:active{transform:scale(.93)}

/* タスクエリア */
.task-area{background:rgba(0,0,0,.18);border-top:1px solid rgba(255,255,255,.1);padding:10px 12px}
.task-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.task-head-lbl{font-family:'Zen Kaku Gothic New',sans-serif;font-size:12px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.05em}
.task-count-badge{background:var(--amber);color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:1px 7px}
.task-add-row{display:flex;gap:6px;margin-bottom:8px}
.task-inp{flex:1;border:1.5px solid rgba(255,255,255,.2);border-radius:10px;padding:9px 12px;font-size:13px;font-family:'M PLUS 1p',sans-serif;background:rgba(255,255,255,.12);color:#fff;outline:none;transition:border .2s;min-width:0}
.task-inp::placeholder{color:rgba(255,255,255,.4)}
.task-inp:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.18)}
.task-add-btn{width:38px;height:38px;border-radius:10px;border:none;background:var(--amber);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.task-add-btn:active{transform:scale(.88)}
.task-scroll{display:flex;flex-direction:column;gap:5px;max-height:200px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.task-scroll:empty::after{content:'タスクはありません 🌱';font-size:12px;color:rgba(255,255,255,.35);padding:6px 0;display:block;text-align:center}
.task-item{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:10px;padding:9px 10px;animation:slideIn .25s ease;transition:opacity .3s}
@keyframes slideIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.task-item.done{opacity:.45}
.task-item.done .task-name{text-decoration:line-through}
.task-name{flex:1;font-size:13px;color:#fff;line-height:1.4;word-break:break-all}
.task-expire{font-size:10px;color:rgba(255,255,255,.35);flex-shrink:0;white-space:nowrap}
.complete-btn{border:1.5px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 10px;font-size:11px;font-weight:700;font-family:'M PLUS 1p',sans-serif;background:none;color:rgba(255,255,255,.7);cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;flex-shrink:0}
.complete-btn:active{transform:scale(.9)}
.task-item.done .complete-btn{background:var(--green3);border-color:var(--green3);color:#fff}
.task-del{background:none;border:none;color:rgba(255,255,255,.3);font-size:16px;cursor:pointer;padding:2px 4px;flex-shrink:0}
.task-del:active{color:var(--red)}

.month-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 14px}
.month-label{font-family:'Zen Kaku Gothic New',sans-serif;font-size:20px;font-weight:700;color:#fff}
.month-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.nav-btn{width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.nav-btn:active{transform:scale(.88);background:rgba(255,255,255,.25)}

.scroll-body{flex:1;overflow-y:auto;padding:0 0 40px;-webkit-overflow-scrolling:touch}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:14px}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--green-mid);border-top-color:var(--green);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:13px;color:var(--text3)}

.names-bar{display:flex;align-items:center;background:#fff;border-bottom:1.5px solid var(--border);padding:10px 16px;gap:4px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.name-spacer{width:54px;flex-shrink:0}
.name-col{flex:1;text-align:center}
.name-input{background:none;border:none;border-bottom:2px dashed transparent;font-size:13px;font-weight:700;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--green);text-align:center;width:100%;padding:3px 2px;outline:none;cursor:pointer;transition:border-color .2s;border-radius:0}
.name-input:focus{border-bottom-color:var(--green3)}
.com-spacer{width:40px;flex-shrink:0}

.month-card{background:#fff;border-radius:var(--r);margin:12px;overflow:hidden;box-shadow:0 2px 16px rgba(26,92,53,.08)}
.day-row{display:flex;align-items:center;gap:4px;padding:7px 16px;border-bottom:1px solid var(--border);background:#fff;transition:background .12s}
.day-row:last-child{border-bottom:none}
.day-row.today{background:#f0fdf4}
.day-info{width:54px;flex-shrink:0;display:flex;align-items:center;gap:6px}
.day-num{font-family:'Zen Kaku Gothic New',sans-serif;font-size:20px;font-weight:700;color:var(--text);line-height:1;width:28px;text-align:center}
.day-wday{font-size:11px;color:var(--text3);margin-top:2px}
.is-sat .day-num,.is-sat .day-wday{color:#2563eb}
.is-sun .day-num,.is-sun .day-wday{color:var(--red)}
.today .day-num{background:var(--green);color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-left:-2px}
.att-cells{display:flex;flex:1;gap:5px}
.att-btn{flex:1;height:40px;border-radius:var(--r2);border:1.5px solid var(--border);background:#fafafa;font-size:16px;font-weight:700;font-family:'Zen Kaku Gothic New',sans-serif;cursor:pointer;color:var(--text3);transition:all .18s cubic-bezier(.34,1.56,.64,1);-webkit-user-select:none;user-select:none}
.att-btn:active{transform:scale(.91)}
.att-maru{background:var(--green-light);border-color:var(--green2);color:var(--green)}
.att-batu{background:var(--red-light);border-color:var(--red);color:var(--red)}
.com-cell{width:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.com-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:#fafafa;font-size:15px;font-weight:700;cursor:pointer;color:var(--text3);display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.34,1.56,.64,1);-webkit-user-select:none;user-select:none}
.com-btn:active{transform:scale(.86)}
.com-btn.has{background:var(--amber-light);border-color:var(--amber);color:var(--amber);animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.35)}50%{box-shadow:0 0 0 5px rgba(245,158,11,0)}}

.legend{display:flex;align-items:center;justify-content:center;gap:16px;padding:12px 16px;font-size:11px;color:var(--text3);border-top:1px solid var(--border)}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-dot{width:16px;height:16px;border-radius:5px;border:1.5px solid}
.dot-maru{background:var(--green-light);border-color:var(--green2)}
.dot-batu{background:var(--red-light);border-color:var(--red)}

.sheet-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0);transition:background .3s;align-items:flex-end}
.sheet-overlay.open{display:flex;background:rgba(0,0,0,.48)}
.sheet{background:#fff;border-radius:var(--r3) var(--r3) 0 0;padding:12px 16px calc(env(safe-area-inset-bottom) + 20px);width:100%;max-width:480px;margin:0 auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,0,.15,1);box-shadow:0 -4px 40px rgba(0,0,0,.18)}
.sheet-overlay.open .sheet{transform:translateY(0)}
.sheet-handle{width:44px;height:5px;border-radius:5px;background:var(--border);margin:0 auto 18px}
.sheet-title{font-family:'Zen Kaku Gothic New',sans-serif;font-size:16px;font-weight:700;color:var(--green);text-align:center;margin-bottom:14px}
.sheet-textarea{width:100%;border:1.5px solid var(--border);border-radius:var(--r2);padding:14px;font-size:15px;font-family:'M PLUS 1p',sans-serif;color:var(--text);background:#fff;resize:none;min-height:120px;outline:none;line-height:1.7;transition:border-color .2s}
.sheet-textarea:focus{border-color:var(--green3)}
.sheet-btns{display:flex;gap:10px;margin-top:12px}
.sheet-btn{flex:1;padding:14px;border-radius:var(--r2);font-family:'M PLUS 1p',sans-serif;font-size:15px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);transition:all .15s}
.sheet-btn:active{transform:scale(.97)}
.btn-save{background:var(--green);color:#fff;border-color:var(--green)}
.btn-cancel{background:#fff;color:var(--text2)}

/* ===== 日報（シート内） ===== */
.sheet{max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rep-sec{margin-bottom:14px}
.rep-lbl{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px}
.mic-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:15px;cursor:pointer;flex-shrink:0;transition:all .2s}
.mic-btn:active{transform:scale(.88)}
.mic-btn.rec{background:var(--red-light);border-color:var(--red);animation:blink 1s infinite}
.rep-inp{width:100%;border:1.5px solid var(--border);border-radius:var(--r2);padding:11px 12px;font-size:15px;font-family:'M PLUS 1p',sans-serif;color:var(--text);background:#fff;outline:none;transition:border-color .2s}
.rep-inp:focus{border-color:var(--green3)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{flex-shrink:0;height:40px;padding:0 13px;border-radius:var(--r2);border:1.5px solid var(--border);background:#fafafa;font-size:13px;font-family:'M PLUS 1p',sans-serif;color:var(--text2);cursor:pointer;transition:all .18s;white-space:nowrap}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--green-light);border-color:var(--green2);color:var(--green);font-weight:700}
.chip.sm{height:34px;font-size:12px;padding:0 11px}
.time-disp{font-size:20px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.time-disp.empty{color:var(--text3);opacity:.5}
.hours-box{background:var(--green-light);border-radius:var(--r2);padding:10px;text-align:center;margin-top:4px}
.hours-box b{font-size:22px;color:var(--green)}
.row-card{background:#f7fbf9;border:1px solid var(--border);border-radius:var(--r2);padding:10px;margin-bottom:8px}
.row-flex{display:flex;gap:7px;align-items:center;margin-top:7px}
.row-flex .rep-inp{flex:1}
.kg-inp{width:74px;text-align:center}
.del-x{width:34px;height:40px;border:none;background:none;color:var(--text3);font-size:19px;cursor:pointer;flex-shrink:0}
.add-btn{width:100%;height:42px;border-radius:var(--r2);border:1.5px dashed var(--green-mid);background:#fff;color:var(--green);font-size:13px;font-weight:700;font-family:'M PLUS 1p',sans-serif;cursor:pointer}
.add-btn:active{transform:scale(.98)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.warn-txt{font-size:11px;color:var(--amber);line-height:1.6;margin-top:6px}

/* ===== 自分えらび・人タブ ===== */
.self-bar{display:flex;align-items:center;gap:7px;background:#fff;padding:10px 16px;border-bottom:1.5px solid var(--border)}
.self-lbl{font-size:11px;color:var(--text3);flex-shrink:0}
.self-chips{display:flex;gap:5px;flex:1}
.self-chip{flex:1;height:38px;border-radius:var(--r2);border:1.5px solid var(--border);background:#fafafa;font-size:13px;font-weight:700;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--text3);cursor:pointer;transition:all .18s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.self-chip.on{background:var(--green);border-color:var(--green);color:#fff}
.self-chip:active{transform:scale(.94)}
.mem-tabs{display:flex;gap:5px;margin-bottom:14px}
.mem-tab{flex:1;height:46px;border-radius:var(--r2);border:1.5px solid var(--border);background:#fafafa;font-size:13px;font-weight:700;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--text3);cursor:pointer;transition:all .18s;position:relative;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-tab.on{background:var(--green-light);border-color:var(--green2);color:var(--green)}
.mem-tab .me{display:block;font-size:9px;font-weight:400;opacity:.7}
.mem-tab .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--green3)}
.who-tag{display:inline-block;background:var(--green-light);color:var(--green);font-size:10px;font-weight:700;border-radius:20px;padding:1px 7px;margin-right:5px}
.tl-row{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--border)}
.tl-row:last-child{border-bottom:none}
.tl-d{width:42px;flex-shrink:0;text-align:center}
.tl-d b{display:block;font-size:16px;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.1}
.tl-d span{font-size:10px;color:var(--text3)}
.tl-body{flex:1;min-width:0}
.tl-t{font-size:13px;color:var(--text);line-height:1.5}
.tl-m{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.5}

/* ===== 見える化 ===== */
.stats-btn{border:1.5px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 10px;font-size:11px;font-weight:700;font-family:'M PLUS 1p',sans-serif;background:none;color:rgba(255,255,255,.8);cursor:pointer;white-space:nowrap}
.stats-btn:active{transform:scale(.93)}
.stat-card{background:#fff;border-radius:var(--r);margin:12px;padding:16px;box-shadow:0 2px 16px rgba(26,92,53,.08)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.stat-box{background:var(--green-light);border-radius:var(--r2);padding:11px;text-align:center}
.stat-box .v{font-size:19px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.stat-box .l{font-size:11px;color:var(--text2);margin-top:2px}
.stat-h{font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:700;color:var(--green);margin-bottom:10px}
.bar-row{margin-bottom:9px}
.bar-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.bar-bg{height:9px;border-radius:9px;background:var(--green-light);overflow:hidden}
.bar-fill{height:100%;border-radius:9px;background:var(--green2)}
.bar-fill.amber{background:var(--amber)}
.chem-row{border-bottom:1px solid var(--border);padding:9px 0;font-size:12px}
.chem-row:last-child{border-bottom:none}
.chem-row .d{color:var(--green);font-weight:700;font-variant-numeric:tabular-nums}
.chem-row .m{color:var(--text3);font-size:11px;margin-top:2px;line-height:1.5}
.csv-btn{width:100%;height:46px;border-radius:var(--r2);border:none;background:var(--green);color:#fff;font-size:14px;font-weight:700;font-family:'M PLUS 1p',sans-serif;cursor:pointer;margin-top:10px}
.csv-btn:active{transform:scale(.98)}
.csv-btn.sub{background:#fff;color:var(--green);border:1.5px solid var(--green-mid)}
.empty-msg{text-align:center;color:var(--text3);font-size:13px;padding:24px 0}

/* ══════════════════════════════════════════════════════
   指で押しやすくする（見た目は変えない）
   小さいボタンの当たり判定だけを 44px まで広げる。
   ::after の透明な板を上にかぶせる方式なので、
   ボタンの大きさ・色・配置は一切変わらない。
   ══════════════════════════════════════════════════════ */
@media (pointer: coarse) {
  .task-del, .complete-btn, .com-btn,
  .stats-btn, .notif-btn, .add-btn { position: relative; }

  .task-del::after, .complete-btn::after, .com-btn::after,
  .stats-btn::after, .notif-btn::after, .add-btn::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 100%; height: 100%;
    min-width: 44px; min-height: 44px;
  }

  /* 削除の × は「完了」の隣にあるので、誤タップしないよう間隔を空ける */
  .task-del { margin-left: 4px; }
  .task-del::after { min-width: 40px; }

  /* 名前の入力欄。タップして直せることが分かりにくいので押しやすくする */
  .name-input { padding: 9px 2px; }

  /* 出欠の丸ボタン。高さ40pxのまま、当たり判定だけ縦に少し広げる */
  .att-btn { position: relative; }
  .att-btn::after {
    content: "";
    position: absolute;
    top: 50%; left: 0;
    transform: translateY(-50%);
    width: 100%; height: 46px;
  }
}

/* 横向き・小さい端末で、月の見出しが詰まらないように */
@media (max-width: 340px) {
  .month-label { font-size: 18px; }
  .chip { padding: 0 10px; font-size: 12px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">🌿</div>
    <div class="header-text">
      <h1>心真農園</h1>
      <p>勤怠確認表</p>
    </div>
    <div class="header-right">
      <button class="stats-btn" id="statsBtn">📊 記録</button>
      <button class="notif-btn" id="notifBtn">🔔</button>
      <div class="sync-area">
        <div class="sync-dot" id="syncDot"></div>
        <span class="sync-txt" id="syncTxt">接続中...</span>
      </div>
    </div>
  </div>

  <div class="task-area">
    <div class="task-head">
      <span class="task-head-lbl">やるべきこと</span>
      <span class="task-count-badge" id="taskCount">0</span>
    </div>
    <div class="task-add-row">
      <input class="task-inp" id="taskInput" placeholder="タスクを追加して Enter..." maxlength="40">
      <button class="task-add-btn" id="taskAddBtn">＋</button>
    </div>
    <div class="task-scroll" id="taskScroll"></div>
  </div>

  <div class="month-nav">

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* 匿名ログイン：データベースを「ログインした人だけ」に閉じるための下準備。 */
/* データベースは「ログインした人だけ」に閉じてあるので、

const authReady = firebase.auth().signInAnonymously()

let year = new Date().getFullYear();

// ── 同期ドット ──
function setSyncDot(s) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncTxt');
  const map = { ok:['sync-dot sync-ok','ライブ同期中'], saving:['sync-dot sync-ing','保存中...'], err:['sync-dot sync-err','接続エラー'] };
  const [cls, label] = map[s] || ['sync-dot','接続中...'];
  dot.className = cls; txt.textContent = label;
}

// ── プッシュ通知 ──
async function setupNotifications() {
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      alert('通知が許可されませんでした。ブラウザの設定から許可してください。');
      return;
    }
    const swReg = await navigator.serviceWorker.register('/makokoro/firebase-messaging-sw.js');
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });
    if (token) {
      // トークンをFirebaseに保存
      await db.ref('kinntai/tokens/' + token.replace(/[.#$[\]]/g, '_')).set({ token: token, updatedAt: Date.now() });
      document.getElementById('notifBtn').textContent = '🔔 通知ON';
      document.getElementById('notifBtn').classList.add('on');
      localStorage.setItem('notifEnabled', '1');
      alert('通知を有効にしました！');
    }
  } catch (e) {
    console.error('通知設定エラー:', e);
    alert('通知の設定に失敗しました。');
  }
}

// フォアグラウンド通知
messaging.onMessage((payload) => {
  const { title, body } = payload.notification || {};
  if (title) new Notification(title, { body, icon: '/makokoro/icon.png' });
});

// 通知ボタン
const notifBtn = document.getElementById('notifBtn');
if (localStorage.getItem('notifEnabled')) {
  notifBtn.textContent = '🔔 通知ON';
  notifBtn.classList.add('on');
}
notifBtn.addEventListener('click', setupNotifications);

// ── ローカル通知（自分以外の変更を検知） ──
function notifyLocal(title, body) {
  if (Notification.permission === 'granted') {
    new Notification(title, { body, icon: '/makokoro/icon.png', badge: '/makokoro/icon.png' });
  }
}

// ── Firebase監視（ログインが終わってから始める）──
authReady.then(() => {
dbRef.on('value', (snap) => {
  const data = snap.val();
  const prevData = JSON.parse(JSON.stringify(dbData));

  if (data) dbData = Object.assign({ names:['メンバー1','メンバー2','メンバー3'], attendance:{}, comments:{}, tasks:[], reports:{} }, data);
  if (!dbData.reports) dbData.reports = {};
  if (!Array.isArray(dbData.tasks)) dbData.tasks = [];

  // 初回ロード以外で変更を検知して通知
  if (!isFirstLoad && Notification.permission === 'granted') {
    // タスク追加検知
    const prevIds = new Set((prevData.tasks||[]).map(t => t.id));
    const newTasks = dbData.tasks.filter(t => !prevIds.has(t.id));
    newTasks.forEach(t => notifyLocal('🌿 心真農園 - 新しいタスク', `「${t.text}」が追加されました`));

    // 出勤変更検知
    const ak = (d) => `${year}_${String(month+1).padStart(2,'0')}_${String(d).padStart(2,'0')}`;
    const days = new Date(year, month+1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      for (let i = 0; i < 3; i++) {
        const prev = (prevData.attendance?.[ak(d)] || {})[i] || '';
        const curr = (dbData.attendance?.[ak(d)] || {})[i] || '';
        if (prev !== curr && curr !== '') {
          const name = dbData.names?.[i] || `メンバー${i+1}`;
          const label = curr === '○' ? '出勤' : '欠勤';
          notifyLocal('🌿 心真農園 - 出勤更新', `${name}さんが${month+1}月${d}日を「${label}」に登録しました`);
        }
      }
    }
  }

  isFirstLoad = false;
  cleanTasks();
  syncNameInputs();
  renderSelfChips();
  renderCalendar();
  renderTasks();
  document.getElementById('loadingEl').style.display = 'none';
  document.getElementById('calWrap').style.display = 'block';
  setSyncDot('ok');
}, (e) => { console.error("読み取り失敗:", e); setSyncDot('err'); });
});

// ── 保存 ──
function saveData() {
  setSyncDot('saving');
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await dbRef.set(dbData); setSyncDot('ok'); }
    catch(e) { setSyncDot('err'); }
  }, 600);
}

// ── タスク自動削除 ──
function cleanTasks() {
  const now = Date.now();
  const before = dbData.tasks.length;
  dbData.tasks = dbData.tasks.filter(t => !t.done || (now - (t.doneAt || 0)) < THREE_DAYS);
  if (dbData.tasks.length !== before) saveData();
}

// ── タスク描画 ──
function renderTasks() {
  const scroll = document.getElementById('taskScroll');
  const pending = dbData.tasks.filter(t => !t.done).length;
  document.getElementById('taskCount').textContent = pending;
  scroll.innerHTML = '';
  const sorted = [...dbData.tasks].sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));
  sorted.forEach(t => {
    const idx = dbData.tasks.findIndex(x => x.id === t.id);
    const div = document.createElement('div');
    div.className = 'task-item' + (t.done ? ' done' : '');
    const name = document.createElement('span'); name.className = 'task-name'; name.textContent = t.text;
    const expire = document.createElement('span'); expire.className = 'task-expire';
    if (t.done && t.doneAt) {
      const remain = Math.ceil((THREE_DAYS - (Date.now() - t.doneAt)) / 86400000);
      expire.textContent = remain > 0 ? `${remain}日後削除` : '間もなく削除';
    }
    const completeBtn = document.createElement('button'); completeBtn.className = 'complete-btn';
    completeBtn.textContent = t.done ? '完了済' : '完了';
    completeBtn.addEventListener('click', () => {
      dbData.tasks[idx].done = !dbData.tasks[idx].done;
      dbData.tasks[idx].doneAt = dbData.tasks[idx].done ? Date.now() : null;
      saveData();
    });
    const delBtn = document.createElement('button'); delBtn.className = 'task-del'; delBtn.textContent = '×';
    delBtn.addEventListener('click', () => { dbData.tasks.splice(idx, 1); saveData(); });
    div.appendChild(name); div.appendChild(expire); div.appendChild(completeBtn); div.appendChild(delBtn);
    scroll.appendChild(div);
  });
}

// ── タスク追加 ──
function addTask() {
  const inp = document.getElementById('taskInput');
  const text = inp.value.trim();
  if (!text) return;
  dbData.tasks.unshift({ id: Date.now(), text, done: false, doneAt: null, createdAt: Date.now() });
  inp.value = '';
  saveData();
}
document.getElementById('taskAddBtn').addEventListener('click', addTask);
document.getElementById('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

// ── 出勤 ──
function ak(d) { return `${year}_${String(month+1).padStart(2,'0')}_${String(d).padStart(2,'0')}`; }
function getAtt(d, i) { return (dbData.attendance?.[ak(d)] || {})[i] || ''; }
function setAtt(d, i, v) {
  if (!dbData.attendance) dbData.attendance = {};
  if (!dbData.attendance[ak(d)]) dbData.attendance[ak(d)] = {};
  dbData.attendance[ak(d)][i] = v; saveData();
}
function getCom(d) { return dbData.comments?.[ak(d)] || ''; }
function setCom(d, v) { if (!dbData.comments) dbData.comments = {}; dbData.comments[ak(d)] = v; saveData(); }
function cycle(c) { return c === '' ? '○' : c === '○' ? '×' : ''; }

// ── カレンダー ──
function renderCalendar() {
  document.getElementById('monthLabel').textContent = `${year}年${month+1}月`;
  document.getElementById('monthSub').textContent = `${MONTHS_EN[month]} ${year}`;
  const days = new Date(year, month+1, 0).getDate();
  const container = document.getElementById('dayRows');
  container.innerHTML = '';
  for (let d = 1; d <= days; d++) {
    const dow = new Date(year, month, d).getDay();
    const isToday = new Date(year, month, d).toDateString() === today.toDateString();
    const row = document.createElement('div');
    row.className = 'day-row' + (dow===0?' is-sun':dow===6?' is-sat':'') + (isToday?' today':'');
    const info = document.createElement('div'); info.className = 'day-info';
    const numEl = document.createElement('div'); numEl.className = 'day-num'; numEl.textContent = d;
    const wdayEl = document.createElement('div'); wdayEl.className = 'day-wday'; wdayEl.textContent = DAYS[dow];
    info.appendChild(numEl); info.appendChild(wdayEl);
    const cells = document.createElement('div'); cells.className = 'att-cells';
    for (let i = 0; i < 3; i++) {
      const v = getAtt(d, i);
      const btn = document.createElement('button');
      btn.className = 'att-btn' + (v==='○'?' att-maru':v==='×'?' att-batu':'');
      btn.textContent = v || '－'; btn.dataset.d = d; btn.dataset.i = i;
      btn.addEventListener('click', function() {
        const nv = cycle(getAtt(+this.dataset.d, +this.dataset.i));
        setAtt(+this.dataset.d, +this.dataset.i, nv);
        this.className = 'att-btn' + (nv==='○'?' att-maru':nv==='×'?' att-batu':'');
        this.textContent = nv || '－';
      });
      cells.appendChild(btn);
    }
    const comCell = document.createElement('div'); comCell.className = 'com-cell';
    const hasCom = getCom(d).trim() !== '' || hasReport(d);
    const cb = document.createElement('button');
    cb.className = 'com-btn' + (hasCom?' has':''); cb.textContent = '!'; cb.dataset.d = d;
    cb.addEventListener('click', function() { openSheet(+this.dataset.d); });
    comCell.appendChild(cb);
    row.appendChild(info); row.appendChild(cells); row.appendChild(comCell);
    container.appendChild(row);
  }
}

// ── 日報シート ──
// 開いている日報が誰のものか。編集中のぶんは3人ぶん手元に持つ
let sheetMember = 0;
let allDrafts = null;

function openSheet(d) {
  modalDay = d;
  sheetMember = myIndex;
  allDrafts = [0,1,2].map(i => getRep(d, i));

}

// 「誰の日報か」タブ。●が付いている人はもう書いてある
function renderMemTabs() {
  const wrap = document.getElementById('memTabs');
  wrap.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const b = document.createElement('button');
    b.className = 'mem-tab' + (sheetMember === i ? ' on' : '');

    nm.textContent = memberName(i);
    b.appendChild(nm);

      const me = document.createElement('span'); me.className = 'me'; me.textContent = '自分';

    }

      const dot = document.createElement('span'); dot.className = 'dot'; b.appendChild(dot);
    }
    b.addEventListener('click', () => {
      sheetMember = i; repDraft = allDrafts[i];
      renderMemTabs(); renderRepForm();
    });
    wrap.appendChild(b);
  }
}

function closeSheet() {
  document.getElementById('sheetOverlay').className = 'sheet-overlay';
  modalDay = null; repDraft = null; allDrafts = null;
}

document.getElementById('sheetSave').addEventListener('click', () => {
  if (modalDay === null) return;
  const d = modalDay;
  // 3人ぶんまとめて保存（空の行は捨てる）
  allDrafts.forEach((r, i) => {
    r.harvest = r.harvest.filter(h => h.crop || h.kg);
    r.chem    = r.chem.filter(c => c.name);
    setRep(d, i, r);
  });
  setCom(d, document.getElementById('sheetTxt').value);
  closeSheet(); renderCalendar();
  if (statsOpen) renderStats();
});

// ── 自分えらび ──
function renderSelfChips() {
  const wrap = document.getElementById('selfChips');
  if (!wrap) return;
  wrap.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const b = document.createElement('button');
    b.className = 'self-chip' + (myIndex === i ? ' on' : '');
    b.textContent = memberName(i);
    b.addEventListener('click', () => {
      myIndex = i; localStorage.setItem('myIndex', String(i));
      renderSelfChips();
    });
    wrap.appendChild(b);
  }
}
document.getElementById('sheetCancel').addEventListener('click', closeSheet);
document.getElementById('sheetOverlay').addEventListener('click', e => { if (e.target === document.getElementById('sheetOverlay')) closeSheet(); });

// ── 月ナビ ──
document.getElementById('prevBtn').addEventListener('click', () => { month--; if(month<0){month=11;year--;} renderCalendar(); document.getElementById('scrollBody').scrollTo(0,0); });

// ── 名前 ──
function syncNameInputs() {
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById('n'+i);
    if (document.activeElement !== el) el.value = dbData.names?.[i] || 'メンバー'+(i+1);
  }
}
for (let i = 0; i < 3; i++) {
  document.getElementById('n'+i).addEventListener('input', function() {
    if (!dbData.names) dbData.names = [];
    dbData.names[+this.id.replace('n','')] = this.value;
    renderSelfChips();
    saveData();
  });
}

const CHEMS   = ['ダコニール','サンクリスタル','ゼンターリ','エコピタ','アーリーセーフ','カリグリーン'];
const BREAKS  = [0, 30, 60, 90];

// ── 自分は誰か（この端末の持ち主）。人ごとに別々に記録する ──
let myIndex = parseInt(localStorage.getItem('myIndex') || '0', 10);
if (!(myIndex >= 0 && myIndex <= 2)) myIndex = 0;
function memberName(i) { return (dbData.names || [])[i] || 'メンバー' + (i + 1); }

// 日報は reports[日付][人番号] に入れる。
// 昔の「日ごと1つ」だったデータは、1人目のぶんとして読み替える
function dayReports(d) {
  const raw = (dbData.reports || {})[ak(d)] || {};
  if (raw.start !== undefined || raw.field !== undefined ||
      raw.harvest !== undefined || raw.chem !== undefined || raw.work !== undefined) {
    return { 0: raw };
  }
  return raw;
}
function blankRep() {
  return { start:'', end:'', breakMin:0, field:'', work:[], workFree:'', harvest:[], chem:[] };
}
function getRep(d, i) {
  const r = dayReports(d)[i] || {};
  return {
    start: r.start || '', end: r.end || '', breakMin: r.breakMin || 0,
    field: r.field || '', work: Array.isArray(r.work) ? r.work : [], workFree: r.workFree || '',
    harvest: Array.isArray(r.harvest) ? r.harvest : [],
    chem: Array.isArray(r.chem) ? r.chem : []
  };
}
function setRep(d, i, r) {
  if (!dbData.reports) dbData.reports = {};
  const cur = dayReports(d);              // 昔の形なら先にほぐす
  const next = Object.assign({}, cur);
  if (isRepEmpty(r)) delete next[i]; else next[i] = r;
  if (Object.keys(next).length) dbData.reports[ak(d)] = next;
  else delete dbData.reports[ak(d)];
  saveData();
}
function isRepEmpty(r) {
  return !(r.start || r.end || r.field || (r.work||[]).length ||
           r.workFree || (r.harvest||[]).length || (r.chem||[]).length);
}
// 誰か1人でも書いていれば「！」ボタンを点ける
function hasReport(d) {
  const day = dayReports(d);
  return Object.keys(day).some(i => !isRepEmpty(getRep(d, i)));
}

// 稼働時間（休憩を引く）
function calcHours(r) {
  if (!r.start || !r.end) return 0;
  const [sh, sm] = r.start.split(':').map(Number);
  const [eh, em] = r.end.split(':').map(Number);
  const diff = (eh*60 + em) - (sh*60 + sm) - (r.breakMin || 0);
  return diff > 0 ? Math.round(diff / 60 * 100) / 100 : 0;
}
// その日○がついた人数（延べ人時を出すため）
function countMaru(d) {
  let n = 0;
  for (let i = 0; i < 3; i++) if (getAtt(d, i) === '○') n++;
  return n;
}

// 編集中の日報。保存を押すまでFirebaseには書かない
let repDraft = null;

// ── チップ（押して選ぶボタン）を並べる ──
function buildChips(el, items, isOn, onTap, small) {
  el.innerHTML = '';
  items.forEach(v => {
    const b = document.createElement('button');
    b.className = 'chip' + (small ? ' sm' : '') + (isOn(v) ? ' on' : '');
    b.textContent = typeof v === 'number' ? (v === 0 ? '休憩なし' : v + '分') : v;
    b.addEventListener('click', () => { onTap(v); renderRepForm(); });
    el.appendChild(b);
  });
}

// ── 収穫の行 ──
function buildHarvestRows() {
  const wrap = document.getElementById('repHarvest');
  wrap.innerHTML = '';
  repDraft.harvest.forEach((h, i) => {
    const card = document.createElement('div'); card.className = 'row-card';

    const chips = document.createElement('div'); chips.className = 'chips';
    CROPS.forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip sm' + (h.crop === c ? ' on' : '');
      b.textContent = c;
      b.addEventListener('click', () => { repDraft.harvest[i].crop = c; renderRepForm(); });
      chips.appendChild(b);
    });
    card.appendChild(chips);

    const row = document.createElement('div'); row.className = 'row-flex';
    const crop = document.createElement('input');
    crop.className = 'rep-inp'; crop.placeholder = '作物名'; crop.value = h.crop || '';
    crop.addEventListener('input', e => { repDraft.harvest[i].crop = e.target.value; });
    const kg = document.createElement('input');
    kg.className = 'rep-inp kg-inp'; kg.type = 'number'; kg.inputMode = 'decimal';
    kg.placeholder = 'kg'; kg.value = h.kg || '';
    kg.addEventListener('input', e => { repDraft.harvest[i].kg = e.target.value; });
    const del = document.createElement('button');
    del.className = 'del-x'; del.textContent = '×';
    del.addEventListener('click', () => { repDraft.harvest.splice(i, 1); renderRepForm(); });
    row.appendChild(crop); row.appendChild(kg); row.appendChild(del);
    card.appendChild(row);

    const dchips = document.createElement('div'); dchips.className = 'chips'; dchips.style.marginTop = '7px';
    DESTS.forEach(v => {
      const b = document.createElement('button');
      b.className = 'chip sm' + (h.dest === v ? ' on' : '');
      b.textContent = v;
      b.addEventListener('click', () => { repDraft.harvest[i].dest = (h.dest === v ? '' : v); renderRepForm(); });
      dchips.appendChild(b);
    });
    card.appendChild(dchips);
    wrap.appendChild(card);
  });
}

// ── 農薬・肥料の行（法定記録の項目にそろえる） ──
function buildChemRows() {
  const wrap = document.getElementById('repChem');
  wrap.innerHTML = '';
  repDraft.chem.forEach((c, i) => {
    const card = document.createElement('div'); card.className = 'row-card';

    const kinds = document.createElement('div'); kinds.className = 'chips';
    ['農薬', '肥料'].forEach(k => {
      const b = document.createElement('button');
      b.className = 'chip sm' + (c.kind === k ? ' on' : '');
      b.textContent = k;
      b.addEventListener('click', () => { repDraft.chem[i].kind = k; renderRepForm(); });
      kinds.appendChild(b);
    });
    card.appendChild(kinds);

    if (c.kind === '農薬') {
      const named = document.createElement('div'); named.className = 'chips'; named.style.marginTop = '7px';
      CHEMS.forEach(n => {
        const b = document.createElement('button');
        b.className = 'chip sm' + (c.name === n ? ' on' : '');
        b.textContent = n;
        b.addEventListener('click', () => { repDraft.chem[i].name = n; renderRepForm(); });
        named.appendChild(b);
      });
      card.appendChild(named);
    }

    const row = document.createElement('div'); row.className = 'row-flex';
    const nm = document.createElement('input');
    nm.className = 'rep-inp'; nm.placeholder = c.kind === '肥料' ? '肥料名' : '農薬名';
    nm.value = c.name || '';
    nm.addEventListener('input', e => { repDraft.chem[i].name = e.target.value; });
    const del = document.createElement('button');
    del.className = 'del-x'; del.textContent = '×';
    del.addEventListener('click', () => { repDraft.chem.splice(i, 1); renderRepForm(); });
    row.appendChild(nm); row.appendChild(del);
    card.appendChild(row);

    const g = document.createElement('div'); g.className = 'grid2';
    const amt = document.createElement('input');
    amt.className = 'rep-inp';
    amt.placeholder = c.kind === '肥料' ? '使用量（例 20kg）' : '希釈倍数（例 1000倍）';
    amt.value = c.amount || '';
    amt.addEventListener('input', e => { repDraft.chem[i].amount = e.target.value; });
    const tg = document.createElement('input');
    tg.className = 'rep-inp'; tg.placeholder = '対象作物'; tg.value = c.target || '';
    tg.addEventListener('input', e => { repDraft.chem[i].target = e.target.value; });
    g.appendChild(amt); g.appendChild(tg);
    card.appendChild(g);
    wrap.appendChild(card);
  });
}

// ── 日報フォームを描き直す ──
function renderRepForm() {
  const r = repDraft;

  const sv = document.getElementById('repStartV');
  sv.textContent = r.start || '--:--';
  sv.className = 'time-disp' + (r.start ? '' : ' empty');
  const ev = document.getElementById('repEndV');
  ev.textContent = r.end || '--:--';
  ev.className = 'time-disp' + (r.end ? '' : ' empty');

  buildChips(document.getElementById('repBreak'), BREAKS,
    v => r.breakMin === v, v => { r.breakMin = v; }, true);

  const h = calcHours(r);
  const box = document.getElementById('repHours');
  if (h > 0) {
    box.style.display = 'block';
    box.innerHTML = memberName(sheetMember) + 'さんの稼働 <b>' + h + '</b> 時間';
  } else {
    box.style.display = 'none';
  }

  buildChips(document.getElementById('repField'), FIELDS,
    v => r.field === v, v => { r.field = (r.field === v ? '' : v); });
  buildChips(document.getElementById('repWork'), WORKS,
    v => r.work.includes(v),
    v => { const i = r.work.indexOf(v); if (i >= 0) r.work.splice(i, 1); else r.work.push(v); }, true);

  const wf = document.getElementById('repWorkFree');
  if (document.activeElement !== wf) wf.value = r.workFree || '';

  buildHarvestRows();
  buildChemRows();
}

// ── 時刻えらび ──
let timeTarget = null;
function openTime(which) {
  timeTarget = which;
  document.getElementById('timeTitle').textContent = which === 'start' ? '開始時刻' : '終了時刻';
  const cur = repDraft[which] || '';

  const hw = document.getElementById('timeHours'); hw.innerHTML = '';
  for (let h = 5; h <= 21; h++) {
    const b = document.createElement('button');
    const on = cur.startsWith(String(h).padStart(2, '0') + ':');
    b.className = 'chip' + (on ? ' on' : '');
    b.style.height = '52px'; b.style.padding = '0'; b.style.fontSize = '18px';
    b.textContent = h;
    b.addEventListener('click', () => {
      const m = cur ? cur.split(':')[1] : '00';
      repDraft[which] = String(h).padStart(2, '0') + ':' + m;
      renderRepForm(); openTime(which);
    });
    hw.appendChild(b);
  }

  const mw = document.getElementById('timeMins'); mw.innerHTML = '';
  ['00', '30'].forEach(m => {
    const b = document.createElement('button');
    b.className = 'chip' + (cur.endsWith(':' + m) ? ' on' : '');
    b.style.height = '52px'; b.style.padding = '0'; b.style.fontSize = '18px';
    b.textContent = ':' + m;
    b.addEventListener('click', () => {
      const hh = cur ? cur.split(':')[0] : String(new Date().getHours()).padStart(2, '0');
      repDraft[which] = hh + ':' + m;
      renderRepForm(); closeTime();   // 分まで決まれば入力完了
    });
    mw.appendChild(b);
  });

  document.getElementById('timeOverlay').className = 'sheet-overlay open';
}
function closeTime() { document.getElementById('timeOverlay').className = 'sheet-overlay'; timeTarget = null; }
document.getElementById('repStart').addEventListener('click', () => openTime('start'));
document.getElementById('repEnd').addEventListener('click', () => openTime('end'));
document.getElementById('timeCancel').addEventListener('click', closeTime);
document.getElementById('timeOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('timeOverlay')) closeTime();
});
document.getElementById('timeNow').addEventListener('click', () => {
  const d = new Date();
  const m = d.getMinutes() < 15 ? '00' : d.getMinutes() < 45 ? '30' : '00';
  const h = d.getMinutes() < 45 ? d.getHours() : d.getHours() + 1;
  repDraft[timeTarget] = String(h).padStart(2, '0') + ':' + m;
  renderRepForm(); closeTime();
});
document.getElementById('timeClear').addEventListener('click', () => {
  repDraft[timeTarget] = ''; renderRepForm(); closeTime();
});

// ── 音声入力（手が汚れていても書ける） ──
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, recBtn = null;
document.querySelectorAll('[data-mic]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!SR) { alert('この端末は音声入力に対応していません。キーボードで入力してください。'); return; }
    if (recog) { recog.stop(); return; }
    const target = document.getElementById(btn.dataset.mic);
    recog = new SR();
    recog.lang = 'ja-JP';
    recog.interimResults = false;
    recog.continuous = false;
    recBtn = btn; btn.classList.add('rec');
    recog.onresult = e => {
      const txt = e.results[0][0].transcript;
      target.value = (target.value ? target.value + ' ' : '') + txt;
      target.dispatchEvent(new Event('input'));
    };
    recog.onerror = e => {
      if (e.error === 'not-allowed') alert('マイクが許可されていません。ブラウザの設定から許可してください。');
    };
    recog.onend = () => { if (recBtn) recBtn.classList.remove('rec'); recog = null; recBtn = null; };
    recog.start();
  });
});

// ═══════════════════════════════════════════
//  見える化（記録タブ）
// ═══════════════════════════════════════════
let statsOpen = false;

function monthReports() {
  const days = new Date(year, month + 1, 0).getDate();
  const out = [];
  for (let d = 1; d <= days; d++) {
    const day = dayReports(d);
    Object.keys(day).forEach(k => {
      const i = parseInt(k, 10);
      const r = getRep(d, i);
      if (!isRepEmpty(r)) out.push({ d, i, r });
    });
  }
  return out;
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const r1 = n => Math.round(n * 10) / 10;
// 収穫を「きゅうり 12.5kg(直売)」の形に
const harvestTxt = r => (r.harvest || []).filter(x => x.crop)
  .map(x => x.crop + (x.kg ? ' ' + x.kg + 'kg' : '') + (x.dest ? '(' + x.dest + ')' : '')).join('・');
const chemTxt = r => (r.chem || []).filter(x => x.name)
  .map(x => x.name + (x.amount ? ' ' + x.amount : '') + (x.target ? '(' + x.target + ')' : '')).join('・');
const workTxt = r => [...(r.work || []), r.workFree].filter(Boolean).join('・');

let statsTab = 'sum';   // sum=まとめ / who=人ごと / log=やったこと

function renderStats() {
  const wrap = document.getElementById('statsWrap');
  const list = monthReports();
  const days = new Date(year, month + 1, 0).getDate();

  // 人ごとに集計
  const per = [0,1,2].map(i => ({ i, hours:0, days:new Set(), kg:0, chem:0 }));
  const byCrop = {};
  list.forEach(({ d, i, r }) => {
    const h = calcHours(r);
    if (h > 0) { per[i].hours += h; per[i].days.add(d); }
    (r.harvest || []).forEach(x => {
      const kg = parseFloat(x.kg);
      if (x.crop && kg > 0) { byCrop[x.crop] = (byCrop[x.crop] || 0) + kg; per[i].kg += kg; }
    });
    per[i].chem += (r.chem || []).filter(c => c.name).length;
  });
  let attDays = 0;
  for (let d = 1; d <= days; d++) if (countMaru(d) > 0) attDays++;

  const totalH  = per.reduce((a, p) => a + p.hours, 0);
  const totalKg = Object.values(byCrop).reduce((a, b) => a + b, 0);
  const crops   = Object.entries(byCrop).sort((a, b) => b[1] - a[1]);
  const maxKg   = crops.length ? crops[0][1] : 1;

  let html = '';
  html += '<div class="stat-card"><div class="mem-tabs" style="margin-bottom:0">' +
    [['sum','まとめ'],['who','人ごと'],['log','やったこと']].map(([k,l]) =>
      '<button class="mem-tab' + (statsTab===k?' on':'') + '" data-st="' + k + '">' + l + '</button>').join('') +
    '</div></div>';

  if (statsTab === 'sum') {
    html += '<div class="stat-card"><div class="stat-h">' + (month+1) + '月のまとめ</div>';
    html += '<div class="stat-grid">' +
      '<div class="stat-box"><div class="v">' + attDays + '</div><div class="l">動いた日</div></div>' +
      '<div class="stat-box"><div class="v">' + r1(totalH) + '</div><div class="l">のべ作業時間 (h)</div></div>' +
      '<div class="stat-box"><div class="v">' + r1(totalKg) + '</div><div class="l">収穫 (kg)</div></div>' +
      '<div class="stat-box"><div class="v">' + (totalH ? r1(totalKg/totalH) : 0) + '</div><div class="l">1時間あたり(kg)</div></div>' +
      '</div>';
    html += '<div class="stat-h">作物ごとの収穫</div>';
    if (!crops.length) html += '<div class="empty-msg">まだ収穫の記録がありません</div>';
    else crops.forEach(([c, kg]) => {
      html += '<div class="bar-row"><div class="bar-top"><span>' + esc(c) + '</span><b>' + r1(kg) + ' kg</b></div>' +
        '<div class="bar-bg"><div class="bar-fill" style="width:' + Math.max(4, kg/maxKg*100) + '%"></div></div></div>';
    });
    html += '</div>';
  }

  if (statsTab === 'who') {
    const maxH = Math.max(...per.map(p => p.hours), 1);
    html += '<div class="stat-card"><div class="stat-h">誰がどれだけ動いたか</div>';
    if (!totalH && !totalKg) html += '<div class="empty-msg">まだ日報がありません</div>';
    per.forEach(p => {
      if (!p.hours && !p.kg && !p.chem) return;
      html += '<div class="bar-row"><div class="bar-top"><span><b>' + esc(memberName(p.i)) + '</b></span>' +
        '<b>' + r1(p.hours) + ' h</b></div>' +
        '<div class="bar-bg"><div class="bar-fill" style="width:' + Math.max(4, p.hours/maxH*100) + '%"></div></div>' +
        '<div style="font-size:11px;color:var(--text3);margin-top:4px">' +
        p.days.size + '日 出た　/　収穫 ' + r1(p.kg) + ' kg　/　農薬肥料 ' + p.chem + '件</div></div>';
    });
    html += '</div>';
  }

  if (statsTab === 'log') {
    html += '<div class="stat-card"><div class="stat-h">やったこと（新しい順）</div>';
    if (!list.length) html += '<div class="empty-msg">まだ日報がありません</div>';
    else [...list].reverse().forEach(({ d, i, r }) => {
      const h = calcHours(r);
      const head = [workTxt(r) || '（作業内容なし）'].join('');
      const sub = [
        r.field, h ? h + 'h' : '',
        r.start && r.end ? r.start + '〜' + r.end : '',
        harvestTxt(r) ? '🧺 ' + harvestTxt(r) : '',
        chemTxt(r) ? '🧪 ' + chemTxt(r) : ''
      ].filter(Boolean).join('　/　');
      html += '<div class="tl-row"><div class="tl-d"><b>' + d + '</b><span>' +
        DAYS[new Date(year, month, d).getDay()] + '</span></div><div class="tl-body">' +
        '<div class="tl-t"><span class="who-tag">' + esc(memberName(i)) + '</span>' + esc(head) + '</div>' +
        (sub ? '<div class="tl-m">' + esc(sub) + '</div>' : '') + '</div></div>';
    });
    html += '</div>';
  }

  // 農薬・肥料は法定記録なので常に出す
  const chemLog = [];
  list.forEach(({ d, i, r }) => (r.chem || []).forEach(c => { if (c.name) chemLog.push({ d, i, ...c, field: r.field || '' }); }));
  html += '<div class="stat-card"><div class="stat-h">農薬・肥料の使用記録</div>';
  if (!chemLog.length) html += '<div class="empty-msg">まだ記録がありません</div>';
  else chemLog.forEach(c => {
    html += '<div class="chem-row"><span class="d">' + (month+1) + '/' + c.d + '</span>　' +
      '<span class="who-tag">' + esc(memberName(c.i)) + '</span>' + esc(c.kind) + '　<b>' + esc(c.name) + '</b>' +
      '<div class="m">' + [c.amount, c.target, c.field].filter(Boolean).map(esc).join('　/　') + '</div></div>';
  });
  html += '<button class="csv-btn" id="csvChem">🧪 農薬使用記録をCSVで出す</button>';
  html += '<button class="csv-btn sub" id="csvAll">📋 栽培記録をCSVで出す</button>';
  html += '</div>';

  wrap.innerHTML = html;
  wrap.querySelectorAll('[data-st]').forEach(b =>
    b.addEventListener('click', () => { statsTab = b.dataset.st; renderStats(); }));
  const cc = document.getElementById('csvChem'); if (cc) cc.addEventListener('click', exportChemCsv);
  const ca = document.getElementById('csvAll');  if (ca) ca.addEventListener('click', exportAllCsv);
}

// ── CSV書き出し ──
function downloadCsv(name, rows) {
  const body = rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  // Excelで文字化けしないようBOMを付ける
  const blob = new Blob(['﻿' + body], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportChemCsv() {
  const rows = [['使用年月日','使用場所（圃場）','対象作物','種別','農薬・肥料の名称','希釈倍数・使用量','使用者']];
  monthReports().forEach(({ d, i, r }) => {
    (r.chem || []).forEach(c => {
      if (!c.name) return;
      rows.push([`${year}/${month+1}/${d}`, r.field || '', c.target || '', c.kind || '', c.name, c.amount || '', memberName(i)]);
    });
  });
  if (rows.length === 1) { alert('この月には農薬・肥料の記録がありません。'); return; }
  downloadCsv(`農薬使用記録_${year}年${month+1}月.csv`, rows);
}
function exportAllCsv() {
  const rows = [['日付','曜日','作業者','開始','終了','休憩(分)','作業時間(h)','圃場','作業内容','収穫','農薬・肥料','その日のメモ']];
  monthReports().forEach(({ d, i, r }) => {
    rows.push([
      `${year}/${month+1}/${d}`, DAYS[new Date(year, month, d).getDay()], memberName(i),
      r.start || '', r.end || '', r.breakMin || 0, calcHours(r) || '',
      r.field || '', workTxt(r), harvestTxt(r), chemTxt(r),
      (getCom(d) || '').replace(/\r?\n/g, ' ')
    ]);
  });
  if (rows.length === 1) { alert('この月にはまだ記録がありません。'); return; }
  downloadCsv(`栽培記録_${year}年${month+1}月.csv`, rows);
}

// ── 記録タブの切替 ──
document.getElementById('statsBtn').addEventListener('click', () => {
  statsOpen = !statsOpen;
  document.getElementById('calWrap').style.display = statsOpen ? 'none' : 'block';
  document.getElementById('statsWrap').style.display = statsOpen ? 'block' : 'none';
  document.getElementById('statsBtn').textContent = statsOpen ? '📅 カレンダー' : '📊 記録';
  if (statsOpen) renderStats();
  document.getElementById('scrollBody').scrollTo(0, 0);
});

</script>
